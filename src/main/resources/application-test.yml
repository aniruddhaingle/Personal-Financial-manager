spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop # Clean slate for every test run
    show-sql: false

  h2:
    console:
      enabled: false

# Disable secure cookie restriction in local mock tests to verify JSESSIONID
cookie:
  secure: false

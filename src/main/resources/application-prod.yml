spring:
  # File-based database for persistence on Render without requiring external databases
  datasource:
    url: jdbc:h2:file:./data/personalfinancedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # H2 console is disabled in production for security
  h2:
    console:
      enabled: false

# Production logging adjustments
logging:
  level:
    root: INFO
    com.syfe.personalfinance: INFO
    org.hibernate.SQL: ERROR
